<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Held-out equity curve</title><desc id="desc">A learned policy and buy-and-hold compared on a held-out mean-reverting synthetic path.</desc>
  <rect width="760" height="360" fill="#0e1117" rx="12"/>
  <text x="42" y="42" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="20" font-weight="700">Held-out equity curve — mean-reverting synthetic path</text>
  <text x="42" y="67" fill="#a8b0bf" font-family="Arial, sans-serif" font-size="13">300 training episodes · seed 7 · evaluation seed 10007</text>
  <g stroke="#293241" stroke-width="1"><line x1="55" y1="120" x2="705" y2="120"/><line x1="55" y1="190" x2="705" y2="190"/><line x1="55" y1="260" x2="705" y2="260"/><line x1="55" y1="90" x2="55" y2="285"/><line x1="55" y1="285" x2="705" y2="285"/></g>
  <g fill="#a8b0bf" font-family="Arial, sans-serif" font-size="12"><text x="12" y="124">$10k</text><text x="12" y="194">$9.3k</text><text x="12" y="264">$8.6k</text><text x="52" y="310">0</text><text x="355" y="310">125</text><text x="680" y="310">251 days</text></g>
  <polyline fill="none" stroke="#4ade80" stroke-width="3" points="55,120 120,211 185,101 250,110 315,155 380,178 445,134 510,155 575,164 640,196 700,236 705,248"/>
  <polyline fill="none" stroke="#60a5fa" stroke-width="3" points="55,120 120,221 185,113 250,122 315,166 380,189 445,145 510,166 575,175 640,207 700,245 705,258"/>
  <circle cx="508" cy="45" r="5" fill="#4ade80"/><text x="520" y="49" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Learned policy</text><circle cx="630" cy="45" r="5" fill="#60a5fa"/><text x="642" y="49" fill="#d1d5db" font-family="Arial, sans-serif" font-size="13">Buy &amp; hold</text>
</svg>
